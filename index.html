<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiMind — Many AIs, One Prompt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e12;
    --surface: #18181f;
    --card: #1e1e28;
    --border: rgba(255,255,255,0.08);
    --border-active: rgba(255,255,255,0.18);
    --text: #f0f0f5;
    --muted: #7a7a90;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --input-bg: #12121a;
    --radius: 14px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    gap: 2.5rem;
  }

  .logo {
    text-align: center;
  }
  .logo h1 {
    font-size: 2.4rem;
    font-weight: 700;
    background: linear-gradient(135deg, #6c63ff, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .logo p {
    color: var(--muted);
    font-size: 1rem;
    margin-top: 6px;
  }

  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .field input, .field select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field input::placeholder { color: var(--muted); }

  .field select option { background: #1e1e28; }

  .provider-hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .provider-hint span {
    color: var(--accent2);
    font-weight: 500;
  }

  .count-btns {
    display: flex;
    gap: 10px;
  }
  .count-btn {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .count-btn:hover { border-color: var(--accent2); color: var(--text); }
  .count-btn.active {
    background: rgba(108,99,255,0.15);
    border-color: var(--accent);
    color: var(--accent2);
  }

  .start-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.01em;
  }
  .start-btn:hover { background: #5a52e0; }
  .start-btn:active { transform: scale(0.98); }

  .err-msg {
    color: #f87171;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
  }

  /* ── CHAT SCREEN ── */
  #chat-screen {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 1.1rem;
    font-weight: 700;
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
  }
  .reset-btn:hover { border-color: var(--border-active); color: var(--text); }

  .ai-tags {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .ai-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .ai-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 4px; }

  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-radius: 16px 16px 4px 16px;
    padding: 12px 18px;
    max-width: 70%;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .ai-replies-grid {
    display: grid;
    gap: 14px;
  }
  .ai-replies-grid.count-2 { grid-template-columns: 1fr 1fr; }
  .ai-replies-grid.count-3 { grid-template-columns: 1fr 1fr 1fr; }
  .ai-replies-grid.count-4 { grid-template-columns: 1fr 1fr; }

  @media (max-width: 700px) {
    .ai-replies-grid.count-2,
    .ai-replies-grid.count-3,
    .ai-replies-grid.count-4 { grid-template-columns: 1fr; }
  }

  .ai-card {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .ai-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .ai-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .ai-card-name { font-size: 0.88rem; font-weight: 600; }
  .ai-card-vibe { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
  .ai-card-body {
    padding: 14px;
    font-size: 0.88rem;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    min-height: 60px;
  }
  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  .input-bar {
    padding: 14px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.95rem;
    resize: none;
    outline: none;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  .input-bar textarea:focus { border-color: var(--accent); }
  .input-bar textarea::placeholder { color: var(--muted); }

  .send-btn {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #5a52e0; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 20px; height: 20px; fill: #fff; }
  .send-btn:disabled { background: #2a2a3a; cursor: not-allowed; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 12px;
    color: var(--muted);
    padding: 2rem;
    text-align: center;
  }
  .empty-state svg { opacity: 0.3; }
  .empty-state h2 { font-size: 1.1rem; font-weight: 600; color: var(--text); opacity: 0.7; }
  .empty-state p { font-size: 0.88rem; }
</style>
</head>
<body>

<!-- ═══════════ SETUP SCREEN ═══════════ -->
<div id="setup-screen">
  <div class="logo">
    <h1>MultiMind</h1>
    <p>Ek prompt, kai AI — alag-alag nazar</p>
  </div>

  <div class="setup-card">
    <div class="field">
      <label>API Key</label>
      <input type="password" id="api-key" placeholder="Paste your API key here..." autocomplete="off" />
      <div class="provider-hint">
        Works with: <span>OpenRouter</span> · <span>Google AI Studio (Gemini)</span> · <span>Any OpenAI-compatible API</span>
      </div>
    </div>

    <div class="field">
      <label>API Base URL</label>
      <select id="api-base">
        <option value="https://openrouter.ai/api/v1">OpenRouter — openrouter.ai</option>
        <option value="https://generativelanguage.googleapis.com/v1beta/openai">Google AI Studio (Gemini)</option>
        <option value="https://api.openai.com/v1">OpenAI — api.openai.com</option>
        <option value="custom">Custom URL...</option>
      </select>
    </div>

    <div class="field" id="custom-url-field" style="display:none">
      <label>Custom Base URL</label>
      <input type="text" id="custom-url" placeholder="https://your-api.com/v1" />
    </div>

    <div class="field">
      <label>Kitne AI chahiye?</label>
      <div class="count-btns">
        <button class="count-btn" data-v="2">2 AI</button>
        <button class="count-btn active" data-v="3">3 AI</button>
        <button class="count-btn" data-v="4">4 AI</button>
      </div>
    </div>

    <div class="err-msg" id="setup-err"></div>

    <button class="start-btn" onclick="startChat()">Start Chatting →</button>
  </div>
</div>

<!-- ═══════════ CHAT SCREEN ═══════════ -->
<div id="chat-screen">
  <div class="topbar">
    <span class="topbar-title">MultiMind</span>
    <button class="reset-btn" onclick="resetToSetup()">⚙ Settings</button>
  </div>

  <div class="ai-tags" id="ai-tags"></div>

  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <h2>Prompt likho neeche</h2>
      <p>Saare AI ek saath jawab denge — alag-alag andaaz mein</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="chat-input" placeholder="Apna prompt yahan likho..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
// ── AI Personalities ──
const AI_PERSONAS = [
  {
    name: "Feasta",
    vibe: "Practical & Direct",
    color: "#6c63ff",
    model: "openai/gpt-4o-mini",
    geminiModel: "gemini-2.0-flash",
    system: "You are Feasta, a practical and direct AI assistant. Give clear, concise, actionable answers. No fluff. Think like a smart friend who gives straight advice. Keep replies short and punchy — 2-4 sentences max unless the topic truly needs more."
  },
  {
    name: "Tino",
    vibe: "Curious & Deep",
    color: "#f472b6",
    model: "openai/gpt-4o-mini",
    geminiModel: "gemini-2.0-flash",
    system: "You are Tino, a curious and deep-thinking AI. You love exploring ideas from unexpected angles. You ask interesting questions back and offer thought-provoking insights. Be engaging and slightly philosophical — but keep it digestible, 3-5 sentences."
  },
  {
    name: "Zara",
    vibe: "Creative & Fun",
    color: "#34d399",
    model: "openai/gpt-4o-mini",
    geminiModel: "gemini-2.0-flash",
    system: "You are Zara, a creative and fun AI. You use analogies, metaphors, and sometimes humor to explain things. Make the mundane interesting! Use vivid language. Keep it warm and friendly, around 3-4 sentences."
  },
  {
    name: "Ryx",
    vibe: "Analytical & Precise",
    color: "#fbbf24",
    model: "openai/gpt-4o-mini",
    geminiModel: "gemini-2.0-flash",
    system: "You are Ryx, an analytical AI. You love data, structure, and precision. Break things down systematically. When possible, use numbered points or structure. Be thorough but not verbose — quality over quantity."
  }
];

let config = { apiKey: '', baseUrl: '', aiCount: 3 };
let isLoading = false;

// ── Setup Logic ──
document.querySelectorAll('.count-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('api-base').addEventListener('change', function() {
  document.getElementById('custom-url-field').style.display =
    this.value === 'custom' ? 'block' : 'none';
});

function startChat() {
  const key = document.getElementById('api-key').value.trim();
  const baseSelect = document.getElementById('api-base').value;
  const customUrl = document.getElementById('custom-url').value.trim();
  const activeCount = document.querySelector('.count-btn.active');
  const errEl = document.getElementById('setup-err');

  errEl.textContent = '';

  if (!key) { errEl.textContent = 'API key paste karo pehle!'; return; }

  let baseUrl = baseSelect === 'custom' ? customUrl : baseSelect;
  if (!baseUrl) { errEl.textContent = 'API URL enter karo.'; return; }

  config.apiKey = key;
  config.baseUrl = baseUrl.replace(/\/$/, '');
  config.aiCount = parseInt(activeCount.dataset.v);

  buildAITags();
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('chat-input').focus();
}

function buildAITags() {
  const container = document.getElementById('ai-tags');
  container.innerHTML = '';
  for (let i = 0; i < config.aiCount; i++) {
    const ai = AI_PERSONAS[i];
    const tag = document.createElement('div');
    tag.className = 'ai-tag';
    tag.innerHTML = `
      <div class="ai-dot" style="background:${ai.color}"></div>
      <span>${ai.name}</span>
      <span style="color:var(--muted);font-weight:400;font-size:0.72rem">${ai.vibe}</span>
    `;
    container.appendChild(tag);
  }
}

function resetToSetup() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
}

// ── Chat Logic ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('chat-input');
  const prompt = input.value.trim();
  if (!prompt) return;

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('empty-state')?.remove();

  input.value = '';
  input.style.height = 'auto';

  const msgs = document.getElementById('messages');

  // User bubble
  const userBubble = document.createElement('div');
  userBubble.className = 'msg-user';
  userBubble.textContent = prompt;
  msgs.appendChild(userBubble);

  // AI replies grid
  const grid = document.createElement('div');
  grid.className = `ai-replies-grid count-${config.aiCount}`;
  msgs.appendChild(grid);

  const cards = [];
  const bodyEls = [];

  for (let i = 0; i < config.aiCount; i++) {
    const ai = AI_PERSONAS[i];
    const card = document.createElement('div');
    card.className = 'ai-card';
    card.innerHTML = `
      <div class="ai-card-header">
        <div class="ai-avatar" style="background:${ai.color}">${ai.name[0]}</div>
        <span class="ai-card-name">${ai.name}</span>
        <span class="ai-card-vibe">${ai.vibe}</span>
      </div>
      <div class="ai-card-body"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    `;
    grid.appendChild(card);
    cards.push(card);
    bodyEls.push(card.querySelector('.ai-card-body'));
  }

  msgs.scrollTop = msgs.scrollHeight;

  // Fire all AI calls in parallel
  const promises = [];
  for (let i = 0; i < config.aiCount; i++) {
    promises.push(callAI(AI_PERSONAS[i], prompt, bodyEls[i]));
  }

  await Promise.allSettled(promises);

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
  msgs.scrollTop = msgs.scrollHeight;
}

async function callAI(persona, prompt, bodyEl) {
  try {
    const isGemini = config.baseUrl.includes('generativelanguage.googleapis.com');
    const model = isGemini ? persona.geminiModel : persona.model;

    const payload = {
      model: model,
      max_tokens: 400,
      messages: [
        { role: "system", content: persona.system },
        { role: "user", content: prompt }
      ]
    };

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${config.apiKey}`
    };

    // OpenRouter needs HTTP-Referer
    if (config.baseUrl.includes('openrouter')) {
      headers['HTTP-Referer'] = window.location.href;
      headers['X-Title'] = 'MultiMind Chat';
    }

    const res = await fetch(`${config.baseUrl}/chat/completions`, {
      method: 'POST',
      headers,
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData?.error?.message || `HTTP ${res.status}`;
      bodyEl.innerHTML = `<span style="color:#f87171">Error: ${escHtml(msg)}</span>`;
      return;
    }

    const data = await res.json();
    const reply = data?.choices?.[0]?.message?.content || '(Koi reply nahi aaya)';
    bodyEl.textContent = reply;

  } catch (err) {
    bodyEl.innerHTML = `<span style="color:#f87171">Network error: ${escHtml(err.message)}</span>`;
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
